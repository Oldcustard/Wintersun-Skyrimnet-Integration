name: "wintersun_shrine_worship_narration"
description: "Narration when player worships at a Wintersun shrine"

eventCriteria:
  eventType: "active_effect"
  schemaConditions:
    - fieldPath: "effect_editor_id"
      operator: "starts_with"
      value: "WSN_Shrine_Effect_WorshipRequest"
      caseSensitive: false
    - fieldPath: "action"
      operator: "equals"
      value: "applied"

response:
  type: "direct_narration"
  content: >-
    {% set deityName = get_script_property("WSN_SkyrimNet_Integration_Quest", "WSN_SkyrimNet_QuestScript", "sLastShrineDeityName") %}
    *{{ player_name }} approaches the shrine and bows their head in reverence to {{ deityName }}.*

audience: "nearby_npcs"
enabled: true
probability: 1.0
cooldownSeconds: 0
priority: 1
