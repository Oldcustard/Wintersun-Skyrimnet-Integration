name: "wintersun_shrine_worship_narration"
description: "Narration when player worships at a Wintersun shrine"

eventCriteria:
  eventType: "active_effect"
  schemaConditions:
    - fieldPath: "effect_editor_id"
      operator: "starts_with"
      value: "WSN_Shrine_Effect_WorshipRequest"
      caseSensitive: false
    - fieldPath: "action"
      operator: "equals"
      value: "applied"

response:
  type: "direct_narration"
  content: |-
    {% set effectId = event_json.effect_editor_id %}
    {% if effectId == "WSN_Shrine_Effect_WorshipRequest_Divine_Julianos" %}
      {% set deityName = "Julianos" %}
    {% elif effectId == "WSN_Shrine_Effect_WorshipRequest_Misc_Syrabane" %}
      {% set deityName = "Syrabane" %}
    {% elif effectId == "WSN_Shrine_Effect_WorshipRequest_Misc_Magnus" %}
      {% set deityName = "Magnus" %}
    {% elif effectId == "WSN_Shrine_Effect_WorshipRequest_Misc_Jephre" %}
      {% set deityName = "Jephre" %}
    {% elif effectId == "WSN_Shrine_Effect_WorshipRequest_Divine_Mara" %}
      {% set deityName = "Mara" %}
